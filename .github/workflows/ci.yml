name: Validate reliability command center
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check pytest ruff
      - run: ruff check src tests
      - run: python -m pytest
      - run: PYTHONPATH=src python -m reliability_command_center.cli --incident examples/checkout-incident.json --decision /tmp/decision.json --metrics /tmp/metrics.prom
