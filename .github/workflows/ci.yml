name: Validate reliability command center
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check pytest ruff
      - run: ruff check src tests
      - run: python -m pytest
      - run: PYTHONPATH=src python -m reliability_command_center.cli --incident examples/checkout-incident.json --decision /tmp/decision.json --metrics /tmp/metrics.prom
